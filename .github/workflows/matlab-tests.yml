name: MATLAB unitary matrix tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matlab:
    name: MATLAB regression and Anymatrix integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b

      - name: Run complete standalone regression suite
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(pwd); test_run;

      - name: Obtain upstream Anymatrix
        run: git clone --depth 1 https://github.com/north-numerical-computing/anymatrix.git "$RUNNER_TEMP/anymatrix"

      - name: Test installed external group via Anymatrix
        uses: matlab-actions/run-command@v3
        with:
          command: |
            root = pwd;
            addpath(fullfile(getenv('RUNNER_TEMP'),'anymatrix'));
            anymatrix('groups','unitary',root);
            ids = anymatrix('groups','unitary');
            assert(any(strcmp(ids,'unitary/jacobi_szego')));
            U = anymatrix('unitary/jacobi_szego',8,0,0,'cmv',1);
            assert(norm(full(U'*U-eye(8)),'fro') < 1e-11);
            S = anymatrix('unitary/dirac_automaton',12,.45,'spectral');
            assert(strcmp(S.finite.kind,'exact'));
            assert(S.dimension==24);
            A = anymatrix('unitary/dirac_automaton',12,.45);
            assert(abs(trace(A)/24-S.finite.moments(1))<1e-11);
            [~,P] = anymatrix('unitary/dirac_automaton',12,.45);
            assert(any(strcmp(P,'unitary')));
            anymatrix('test','unitary');

  notify-spectral-density:
    name: Notify spectral density after successful matrix CI
    needs: matlab
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch the tested upstream SHA to spectral-density CI
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.SPECTRAL_DENSITY_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DISPATCH_TOKEN" ]]; then
            echo "::notice::Set SPECTRAL_DENSITY_DISPATCH_TOKEN in the anymatrix-unitary Actions secrets to enable immediate downstream integration tests. Downstream daily CI remains active."
            exit 0
          fi
          payload="$(printf '{"event_type":"anymatrix-main-passed","client_payload":{"anymatrix_sha":"%s","source_run_id":"%s"}}' "$GITHUB_SHA" "$GITHUB_RUN_ID")"
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jaurentz/unitary-spectral-density/dispatches \
            -d "$payload"
          echo "Dispatched upstream commit $GITHUB_SHA to jaurentz/unitary-spectral-density." >> "$GITHUB_STEP_SUMMARY"
